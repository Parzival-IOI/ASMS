services:
  postgres:
    image: postgres:latest
    container_name: postgresDB
    ports:
      - 5432:5432
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2003
      POSTGRES_DB: group1_database

  quiz:
    container_name: ASMS
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    env_file:
      - ./.env.local
    depends_on:
      - postgres

